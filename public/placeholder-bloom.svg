<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <rect width="600" height="800" fill="#F4EFEA"/>
  <g transform="translate(300, 400)" stroke="#8C3A4A" stroke-width="2" fill="none" opacity="0.6">
    <!-- Stem -->
    <path d="M0,60 Q-10,180 0,260" stroke="#7A8B7B" stroke-width="3" />
    <path d="M-5,160 Q-40,140 -50,110 Q-30,120 -5,160" fill="#7A8B7B" fill-opacity="0.3" stroke="#7A8B7B" />
    <path d="M-2,200 Q30,180 40,150 Q20,165 -2,200" fill="#7A8B7B" fill-opacity="0.3" stroke="#7A8B7B" />
    <!-- Bloom Petals -->
    <ellipse cx="0" cy="-60" rx="35" ry="60" fill="#8C3A4A" fill-opacity="0.1" />
    <ellipse cx="-45" cy="-25" rx="35" ry="55" transform="rotate(-40 -45 -25)" fill="#8C3A4A" fill-opacity="0.1" />
    <ellipse cx="45" cy="-25" rx="35" ry="55" transform="rotate(40 45 -25)" fill="#8C3A4A" fill-opacity="0.1" />
    <ellipse cx="-30" cy="30" rx="30" ry="50" transform="rotate(-70 -30 30)" fill="#8C3A4A" fill-opacity="0.1" />
    <ellipse cx="30" cy="30" rx="30" ry="50" transform="rotate(70 30 30)" fill="#8C3A4A" fill-opacity="0.1" />
    <circle cx="0" cy="0" r="18" fill="#8C3A4A" fill-opacity="0.3" stroke="#8C3A4A" />
  </g>
  <text x="300" y="680" font-family="serif" font-style="italic" font-size="20" fill="#5A4E47" text-anchor="middle" letter-spacing="3">The Petal &amp; Bloom</text>
  <text x="300" y="710" font-family="sans-serif" font-size="11" fill="#8A7E77" text-anchor="middle" letter-spacing="2">HANDCRAFTED BOTANICAL ATELIER</text>
</svg>
